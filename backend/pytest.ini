[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    smoke: fast sanity tests (<5s total); must pass before every commit
    integration: hits real Gemini / Twilio / Supabase; run manually, not in watch
    slow: individual test >2s
filterwarnings =
    ignore::DeprecationWarning
